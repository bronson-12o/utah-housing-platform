<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f6f3eb"/><g font-family="Arial,sans-serif" fill="#18392d"><text x="40" y="53" font-size="28" font-weight="700">Warehouse model · PostgreSQL</text><text x="40" y="85" font-size="16">One current county fact per year + GEOID + synthetic partition; full accepted revision history.</text></g><g fill="white" stroke="#a4b9aa" stroke-width="2"><rect x="40" y="145" width="310" height="300" rx="12"/><rect x="430" y="145" width="330" height="300" rx="12"/><rect x="840" y="145" width="320" height="180" rx="12"/><rect x="840" y="365" width="320" height="145" rx="12"/></g><g font-family="monospace" font-size="16" fill="#18392d"><text x="60" y="179" font-weight="700">housing_runs</text><text x="60" y="215">PK run_id</text><text x="60" y="245">command, period, status</text><text x="60" y="275">started_at, finished_at</text><text x="60" y="305">source_sha256, error</text><text x="60" y="335">rows_loaded, changed_rows</text><text x="60" y="365">synthetic</text><text x="450" y="179" font-weight="700">housing_source_versions</text><text x="450" y="215">PK version_id</text><text x="450" y="245">FK accepted_run_id</text><text x="450" y="275">year, basis, synthetic</text><text x="450" y="305">sha256, url, retrieved_at</text><text x="450" y="335">active, accepted_at</text><text x="450" y="365">one active per partition</text><text x="860" y="179" font-weight="700">housing_county_annual</text><text x="860" y="215">PK year, geoid, synthetic</text><text x="860" y="245">FK source_version_id</text><text x="860" y="275">units, buildings, valuation</text><text x="860" y="302">row_data JSONB</text><text x="860" y="399" font-weight="700">housing_county_history</text><text x="860" y="430">PK version_id + geoid</text><text x="860" y="460">FK version_id</text><text x="860" y="490">row_data JSONB</text></g><g stroke="#ad6e25" stroke-width="3" fill="none"><path d="M350 245H430"/><path d="M760 245H840"/><path d="M760 305H795V430H840"/></g><g font-family="Arial,sans-serif" font-size="15" fill="#18392d"><text x="369" y="232">1:N</text><text x="778" y="232">1:N</text><text x="799" y="417">1:N</text><text x="40" y="551">Accepted source + current facts + history commit together; rejected loads retain last published facts.</text></g></svg>