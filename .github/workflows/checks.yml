name: Source and warehouse checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: housing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U housing -d housing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://housing:isolated-ci-only@127.0.0.1:5432/housing_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/verify_snapshot.py --offline
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: isolated-ci-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7
