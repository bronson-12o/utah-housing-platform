[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "utah-housing-platform"
version = "0.1.0"
description = "Source-versioned Utah construction authorization data, locally reproducible."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.3.9", "fastapi==0.165.0", "uvicorn==0.54.0", "dagster==1.13.31", "dagster-webserver==1.13.31"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
utah-housing = "utah_housing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utah_housing = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: isolated PostgreSQL integration tests (TEST_DATABASE_URL required)"]
